<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Forms</title>
</head>
<body>
    <header></header>
    <main>
        <h3>Faça seu cadastro</h3>
        <form id="registerForm" method="POST">
            <label for="nome"> Nome completo: </label>
            <input id="nome" name="nome" type="text" required />
            <br>
            <label for="email"> Informe seu e-mail: </label>
            <input id="email" name="email" type="email" required />
            <br>
            <label for="senha"> Digite sua senha: </label>
            <input type="password" id="senha" name="senha" required minlength="8" maxlength="12" />
            <br>
            <textarea id="mensagem" name="mensagem" rows="4" cols="30"></textarea>
            <br>
            <label for="evento"> Escolha seu evento: </label>
            <select id="evento" name="evento">
                <option value="Show de Rock"> Show de Rock </option>
                <option value="Show de Modão"> Show de Modão </option>
                <option value="Jogos Universitários"> Jogos Universitários </option>
            </select>
            <br>
            <br>
            <label>
                <input type="checkbox" id="termos" name="termos" required />
                Concordo com os termos de uso
            </label>
                <br>
                <p>Forma de pagamento: </p>
            <label>
                <input type="radio" value="pix" name="pagamento" />
                Pix
            </label>
            <label>
                <input type="radio" value="cartao" name="pagamento" />
                Cartão
            </label>
            <br>
            <br>
            <input placeholder="Informe seu CPF" type="text" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Formato esperado 000.000.000-00" required />
            <br>
            <br>
            <input type="submit" value="Cadastrar" />
        </form>  
    </main>
    <footer></footer>
    <script>
        // Capturando um elemento HTML pelo ID
        // Escutando o event de submit deste elemento HTML
        document.getElementById('registerForm').addEventListener('submit',function(event){
            // Impedindo o comportamento padrão de envio do form
            event.preventDefault()
            // Pegando o valor preenchido no input nome
            const nome = document.getElementById('nome').value;
            const senha = document.getElementById('senha').value;
            const email = document.getElementById('email').value;
            // Criando um alerta na tela
            alert("Olá "+nome+" seu formulário foi enviado")
        })
    </script>
</body>
</html>
